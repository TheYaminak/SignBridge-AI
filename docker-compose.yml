# Usage: cp .env.example .env  (then set MODEL_API_KEY)
#        docker compose up --build
# UI: http://localhost:3000   API: http://localhost:8080

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # Variables are listed explicitly so only the backend ever sees the Meta key.
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-75s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
      MIN_SIGN_CONFIDENCE: ${MIN_SIGN_CONFIDENCE:-0.6}
      MODEL_API_KEY: ${MODEL_API_KEY:-${META_API_KEY:-}}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      META_API_TIMEOUT: ${META_API_TIMEOUT:-45s}

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is a host URL, not http://backend:8080.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_ENABLE_DEV_TOOLS: ${NEXT_PUBLIC_ENABLE_DEV_TOOLS:-true}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
